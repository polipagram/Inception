services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    secrets:
      - root_passwd
      - user_passwd
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx

    ports:
      - "8080:443"

    networks:
      - inception

  wordpress:
    build: 
      context: ./requirements/wordpress
    image : wordpress
    container_name : wordpress
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb

secrets:
  root_passwd:
    file: ../secrets/root_passwd.txt
  user_passwd:
    file: ../secrets/user_passwd.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb
      o: bind

  wordpress_data:
      driver: local
      driver_opts:
        type: none
        device: ${HOME}/data/wordpress
        o: bind
        
networks:
  inception:
    driver: bridge




